<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>From village to market</title>
<style>
:root{--bg:#fff;--land:#F4F2ED;--grid:#fff;--ink:#2B2F33;--mut:#7A8086;--line:#E3E5E8;--chip:#F4F2ED;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151718;--land:#23262A;--grid:#2E3236;--ink:#ECEDEE;--mut:#9AA0A6;--line:#33373B;--chip:#23262A}}
:root[data-theme="dark"]{--bg:#151718;--land:#23262A;--grid:#2E3236;--ink:#ECEDEE;--mut:#9AA0A6;--line:#33373B;--chip:#23262A}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Carlito,Calibri,"Segoe UI",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:22px 18px 28px}
h1{font-size:30px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 16px;max-width:60ch}
.bar{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px}
.seg button{border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:5px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:7px;align-items:center;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:4px 12px;border-radius:99px;cursor:pointer}
.chip i{width:18px;height:4px;border-radius:2px;background:var(--c)}
.chip[aria-pressed=false]{opacity:.45}.chip[aria-pressed=false] i{background:var(--mut)}
button:focus-visible,li:focus-visible{outline:2px solid #3D7EA6;outline-offset:2px}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:760px){.main{grid-template-columns:1fr}}
svg{width:100%;height:auto;display:block;border-radius:10px;background:var(--land)}
svg text{font-family:inherit}
.flow{transition:opacity .15s}.dim{opacity:.13}.hit{cursor:pointer}
.mname{font-weight:700;font-size:13px;fill:var(--ink)}.vname{font-size:10.5px;font-style:italic;fill:var(--mut)}
.cap{font-size:9.5px;fill:var(--mut)}.tag rect{fill:var(--bg);stroke:var(--line)}.tag text{font-size:9.5px;font-weight:700;fill:var(--ink)}
.tick{font-size:8px;fill:var(--mut);opacity:.7}
.list{list-style:none;margin:0;padding:0}.list h3{font-size:14px;margin:14px 0 4px;padding:5px 10px;background:var(--land);border-radius:7px}
.list h3:first-child{margin-top:0}
.list li{display:grid;grid-template-columns:44px 1fr auto;gap:8px;padding:6px 10px;border-radius:7px;align-items:baseline;cursor:default}
.list li.on{background:var(--land);box-shadow:inset 3px 0 0 var(--ink)}
.id{font-weight:700}.id b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.fr{color:var(--ink)}.fr.loc{color:var(--mut)}.pr{text-align:right;font-variant-numeric:tabular-nums}
.pr span{margin-left:10px;white-space:nowrap}.pr small{color:var(--mut)}
#tip{position:fixed;pointer-events:none;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 12px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:13.5px;max-width:260px;display:none;z-index:9}
#tip h4{margin:0 0 4px;font-size:14px}#tip div{display:flex;justify-content:space-between;gap:14px}
.note{color:var(--mut);font-size:12.5px;margin:14px 0 0;max-width:80ch}
</style></head><body><div class="wrap">
<h1>From village to market</h1>
<p class="sub">Where milk and meat sold in three Kenyan markets were produced, who sells them, and what they cost. Hover an arrow or a seller to see the details.</p>
<div class="bar">
 <div class="seg" id="tabs"><button data-v="Dairy" aria-pressed="true">Dairy</button><button data-v="Meat" aria-pressed="false">Meat</button></div>
 <div class="chips" id="chips"></div>
 <div class="seg" id="season" title="Season shown in the price list"><button data-v="w" aria-pressed="true">Wet season</button><button data-v="d" aria-pressed="false">Dry season</button></div>
</div>
<div class="main"><svg id="map" viewBox="0 0 430 577" role="img" aria-label="Map of flows from villages to markets"></svg><ul class="list" id="list"></ul></div>
<p class="note" id="note"></p></div><div id="tip"></div>
<script>
const D={"rows":[{"id":1,"vc":"Dairy","g":"Female","p":"Cow milk","v":"Tikondo","m":"Namelok","w":80,"d":120},{"id":2,"vc":"Dairy","g":"Female","p":"Cow milk","v":"Tikondo","m":"Namelok","w":60,"d":120},{"id":3,"vc":"Dairy","g":"Female","p":"Cow milk","v":"Kimana","m":"Namelok","w":70,"d":130},{"id":4,"vc":"Meat","g":"Male","p":"Goat","v":"Namelok","m":"Namelok","w":900,"d":900},{"id":5,"vc":"Dairy","g":"Male","p":"Cow milk","v":"Kimana","m":"Namelok","w":90,"d":120},{"id":6,"vc":"Meat","g":"Male","p":"Goat","v":"Kimana","m":"Namelok","w":850,"d":850},{"id":6,"vc":"Meat","g":"Male","p":"Sheep","v":"Kimana","m":"Namelok","w":850,"d":850},{"id":7,"vc":"Meat","g":"Male","p":"Beef","v":"Kimana","m":"Namelok","w":900,"d":900},{"id":8,"vc":"Meat","g":"Male","p":"Goat","v":"Namelok","m":"Namelok","w":900,"d":900},{"id":8,"vc":"Meat","g":"Male","p":"Sheep","v":"Namelok","m":"Namelok","w":850,"d":850},{"id":9,"vc":"Dairy","g":"Female","p":"Cow milk","v":"Impironi","m":"Kimana","w":60,"d":100},{"id":10,"vc":"Dairy","g":"Female","p":"Cow milk","v":"Kimana","m":"Kimana","w":70,"d":100},{"id":11,"vc":"Dairy","g":"Female","p":"Cow milk","v":"Kimana","m":"Kimana","w":90,"d":100},{"id":13,"vc":"Meat","g":"Male","p":"Beef","v":"Kimana","m":"Kimana","w":900,"d":900},{"id":14,"vc":"Meat","g":"Male","p":"Goat","v":"Kimana","m":"Kimana","w":900,"d":900},{"id":16,"vc":"Dairy","g":"Male","p":"Cow milk","v":"Imbarueti","m":"Kimana","w":80,"d":120},{"id":16,"vc":"Meat","g":"Male","p":"Beef","v":"Imbarueti","m":"Kimana","w":1000,"d":1000},{"id":16,"vc":"Meat","g":"Male","p":"Goat","v":"Imbarueti","m":"Kimana","w":1000,"d":1000},{"id":16,"vc":"Meat","g":"Male","p":"Sheep","v":"Imbarueti","m":"Kimana","w":800,"d":800},{"id":17,"vc":"Meat","g":"Male","p":"Goat","v":"Kimana","m":"Kimana","w":1000,"d":1000},{"id":17,"vc":"Meat","g":"Male","p":"Sheep","v":"Kimana","m":"Kimana","w":1000,"d":1000},{"id":18,"vc":"Dairy","g":"Male","p":"Cow milk","v":"Osoit","m":"Kimana","w":200,"d":250},{"id":18,"vc":"Meat","g":"Male","p":"Beef","v":"Osoit","m":"Kimana","w":900,"d":900},{"id":18,"vc":"Meat","g":"Male","p":"Goat","v":"Osoit","m":"Kimana","w":800,"d":850},{"id":18,"vc":"Meat","g":"Male","p":"Sheep","v":"Osoit","m":"Kimana","w":800,"d":850},{"id":20,"vc":"Dairy","g":"Male","p":"Cow milk","v":"Osoit","m":"Kimana","w":90,"d":120},{"id":20,"vc":"Meat","g":"Male","p":"Beef","v":"Osoit","m":"Kimana","w":850,"d":850},{"id":20,"vc":"Meat","g":"Male","p":"Goat","v":"Osoit","m":"Kimana","w":900,"d":900},{"id":21,"vc":"Meat","g":"Male","p":"Beef","v":"Nakueni","m":"Kimana","w":850,"d":850},{"id":22,"vc":"Dairy","g":"Female","p":"Cow milk","v":"Tikondo","m":"Isinet","w":90,"d":120},{"id":23,"vc":"Dairy","g":"Female","p":"Cow milk","v":"Kimana","m":"Isinet","w":80,"d":120},{"id":24,"vc":"Dairy","g":"Female","p":"Cow milk","v":"Kimana","m":"Isinet","w":80,"d":100},{"id":25,"vc":"Dairy","g":"Male","p":"Cow milk","v":"Kimana","m":"Isinet","w":90,"d":120},{"id":27,"vc":"Meat","g":"Male","p":"Goat","v":"Kimana","m":"Isinet","w":1000,"d":1000},{"id":27,"vc":"Meat","g":"Male","p":"Sheep","v":"Kimana","m":"Isinet","w":1000,"d":1000},{"id":28,"vc":"Meat","g":"Male","p":"Beef","v":"Namelok","m":"Isinet","w":850,"d":850}],"M":{"Namelok":[37.45277,-2.71592],"Kimana":[37.53644,-2.7984],"Isinet":[37.50456,-2.73554]},"V":{"Tikondo":[37.55078,-2.81315],"Kimana":[37.53644,-2.7984],"Namelok":[37.45277,-2.71592],"Impironi":[37.52231,-2.85516],"Imbarueti":[37.46449,-2.68394],"Osoit":[37.45318,-2.69208],"Nakueni":[37.71138,-2.29717]},"NK":[37.711382,-2.297169],"miss":{"Dairy":[12],"Meat":[15,19,26,29]}},W=430,H=577,X0=37.405,X1=37.595,Y0=-2.640,Y1=-2.895;
const P=(lo,la)=>[(lo-X0)/(X1-X0)*W,(Y0-la)/(Y0-Y1)*H];
const CATS={Dairy:{k:'g',c:{Female:'#E07A5F',Male:'#3D7EA6'}},Meat:{k:'p',c:{Beef:'#8E4162',Goat:'#E3A02F',Sheep:'#5BA58C'}}};
const S={tab:'Dairy',se:'w',off:{Dairy:new Set(),Meat:new Set()}};
const $=s=>document.querySelector(s),svg=$('#map'),tip=$('#tip');
const bez=(a,b,bd,n=50)=>{const dx=b[0]-a[0],dy=b[1]-a[1],c=[(a[0]+b[0])/2-bd*dy,(a[1]+b[1])/2+bd*dx];
 return Array.from({length:n+1},(_,i)=>{const t=i/n,u=1-t;return[u*u*a[0]+2*u*t*c[0]+t*t*b[0],u*u*a[1]+2*u*t*c[1]+t*t*b[1]]})};
const side=(a,b,oth)=>{let best=-1,bs=1;for(const s of[1,-1]){const m=bez(a,b,.2*s)[25];
 const d=Math.min(...oth.map(o=>Math.hypot(m[0]-o[0],m[1]-o[1])),999);if(d>best){best=d;bs=s}}return bs};
const trim=(p,ro,rm)=>p.filter(q=>Math.hypot(q[0]-p[0][0],q[1]-p[0][1])>ro&&Math.hypot(q[0]-p.at(-1)[0],q[1]-p.at(-1)[1])>rm);
const pth=p=>'M'+p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join('L');
const arrow=(p,c)=>{const a=p.at(-6),b=p.at(-1),t=Math.atan2(b[1]-a[1],b[0]-a[0]),s=7,w=3.6;
 const pt=(l,k)=>(b[0]-l*Math.cos(t)-k*Math.sin(t)).toFixed(1)+','+(b[1]-l*Math.sin(t)+k*Math.cos(t)).toFixed(1);
 return`<polygon points="${b[0].toFixed(1)},${b[1].toFixed(1)} ${pt(s,w)} ${pt(s,-w)}" fill="${c}"/>`};
const MK=Object.fromEntries(Object.entries(D.M).map(([k,v])=>[k,P(...v)]));
const VL={Tikondo:[7,12,'start'],Impironi:[8,3,'start'],Imbarueti:[8,-6,'start'],Osoit:[-8,-6,'end']};
const ML={Namelok:[-14,0,'end'],Isinet:[13,-2,'start'],Kimana:[16,-12,'start']};
function rowsNow(all){const k=CATS[S.tab].k;return D.rows.filter(r=>r.vc===S.tab&&(all||!S.off[S.tab].has(r[k])))}
function tagEl(pt,ids,hit){const t=ids.join(' · '),w=t.length*5.6+10;
 return`<g class="tag" ${hit}><rect x="${pt[0]-w/2}" y="${pt[1]-8}" width="${w}" height="16" rx="8"/><text x="${pt[0]}" y="${pt[1]+3.4}" text-anchor="middle">${t}</text></g>`}
function draw(){
 const {k,c}=CATS[S.tab],all=rowsNow(true),on=rowsNow(false);let o='';
 for(let x=37.42;x<X1;x+=.04)o+=`<line x1="${P(x,0)[0]}" x2="${P(x,0)[0]}" y1="0" y2="${H}" stroke="var(--grid)" stroke-width="1.2"/><text class="tick" x="${P(x,0)[0]}" y="${H-5}" text-anchor="middle">${x.toFixed(2)}°E</text>`;
 for(let y=-2.66;y>Y1;y-=.04)o+=`<line y1="${P(0,y)[1]}" y2="${P(0,y)[1]}" x1="0" x2="${W}" stroke="var(--grid)" stroke-width="1.2"/><text class="tick" x="5" y="${P(0,y)[1]-3}">${Math.abs(y).toFixed(2)}°S</text>`;
 const grp=(rs,f)=>{const g={};rs.forEach(r=>(g[f(r)]??=[]).push(r));return g};
 const info=(rs,ttl)=>`data-ids="${[...new Set(rs.map(r=>r.id))]}" data-t="${ttl}" data-c="${[...new Set(rs.map(r=>r[k]))]}"`;
 // flows
 const fl=grp(on.filter(r=>r.v!==r.m&&r.v!=='Nakueni'),r=>r.v+'|'+r.m),fa=grp(all.filter(r=>r.v!==r.m&&r.v!=='Nakueni'),r=>r.v+'|'+r.m);
 for(const key in fl){const[v,m]=key.split('|'),a=P(...D.V[v]),b=MK[m],oth=Object.entries(MK).filter(([n])=>n!==m&&n!==v).map(e=>e[1]);
  const sg=side(a,b,oth),cs=Object.keys(c).filter(x=>fa[key].some(r=>r[k]===x));
  cs.forEach((x,i)=>{if(!fl[key].some(r=>r[k]===x))return;const p=trim(bez(a,b,sg*(.16+.075*i)),7,13),rs=fl[key].filter(r=>r[k]===x);
   o+=`<g class="flow" ${info(rs,v+' → '+m)}><path d="${pth(p)}" fill="none" stroke="${c[x]}" stroke-width="3" stroke-linecap="round"/>${arrow(p,c[x])}<path class="hit" d="${pth(p)}" fill="none" stroke="transparent" stroke-width="13"/></g>`});
  const ids=[...new Set(fl[key].map(r=>r.id))].sort((x,y)=>x-y);
  o+=`<g class="flow" ${info(fl[key],v+' → '+m)}>${tagEl(bez(a,b,sg*(.16+.075*(cs.length-1)+.085))[25],ids,'class="hit"')}</g>`}
 // Nakueni
 const nk=on.filter(r=>r.v==='Nakueni');if(nk.length){const K=MK.Kimana,N=P(...D.NK),t=(10-K[1])/(N[1]-K[1]),T=[K[0]+t*(N[0]-K[0]),10];
  const p=trim(Array.from({length:40},(_,i)=>[T[0]+(K[0]-T[0])*i/39,T[1]+(K[1]-T[1])*i/39]),0,13),col=c[nk[0][k]];
  o+=`<g class="flow" ${info(nk,'Nakueni → Kimana (59 km NNE)')}><path d="${pth(p)}" stroke="${col}" stroke-width="3" stroke-dasharray="7 5" fill="none"/>${arrow(p,col)}<path class="hit" d="${pth(p)}" stroke="transparent" stroke-width="13" fill="none"/>
  ${tagEl([T[0]+(K[0]-T[0])*.4,T[1]+(K[1]-T[1])*.4],[21],'class="hit"')}<text class="vname" x="${T[0]-6}" y="22" text-anchor="end">from Nakueni</text><text class="cap" x="${T[0]-6}" y="33" text-anchor="end">59 km NNE</text></g>`}
 // villages
 const used=new Set(all.filter(r=>r.v!==r.m&&D.V[r.v]&&!D.M[r.v]).map(r=>r.v));
 used.forEach(v=>{const q=P(...D.V[v]),[dx,dy,an]=VL[v]||[8,3,'start'];o+=`<circle cx="${q[0]}" cy="${q[1]}" r="4.6" fill="var(--bg)" stroke="var(--mut)" stroke-width="1.6"/><text class="vname" x="${q[0]+dx}" y="${q[1]+dy}" text-anchor="${an}">${v}</text>`});
 // markets + rings
 for(const m in MK){const[x,y]=MK[m],loc=grp(on.filter(r=>r.v===m&&r.m===m),r=>r[k]),la=all.filter(r=>r.v===m&&r.m===m),cs=Object.keys(c).filter(z=>la.some(r=>r[k]===z)),ls=on.filter(r=>r.v===m&&r.m===m);
  cs.forEach((z,i)=>{if(loc[z])o+=`<g class="flow" ${info(loc[z],m+' (sold where produced)')}><circle cx="${x}" cy="${y}" r="${9+4.4*i}" fill="none" stroke="${c[z]}" stroke-width="2.6"/><circle class="hit" cx="${x}" cy="${y}" r="${9+4.4*i}" fill="none" stroke="transparent" stroke-width="7"/></g>`});
  o+=`<circle cx="${x}" cy="${y}" r="5.2" fill="var(--ink)" stroke="var(--bg)" stroke-width="1.6"/>`;
  const[dx,dy,an]=ML[m],ex=ls.length?(9+4.4*cs.length)*Math.sign(dx):0;
  o+=`<text class="mname" x="${x+dx+ex*.5}" y="${y+dy}" text-anchor="${an}">${m}</text>`;
  if(ls.length)o+=`<text class="cap" x="${x+dx+ex*.5}" y="${y+dy+12}" text-anchor="${an}">local: ${[...new Set(ls.map(r=>r.id))].sort((a,b)=>a-b).join(' · ')}</text>`}
 // scale + north
 const km=5/(111.32*Math.cos(.048))/(X1-X0)*W;
 o+=`<line x1="12" x2="${12+km}" y1="${H-22}" y2="${H-22}" stroke="var(--ink)" stroke-width="2.6"/><text class="cap" x="${12+km/2}" y="${H-27}" text-anchor="middle" style="fill:var(--ink)">5 km</text>
 <path d="M${W-18},${H-22}V${H-48}" stroke="var(--ink)" stroke-width="1.5"/><path d="M${W-18},${H-52}l-4,9h8z" fill="var(--ink)"/><text class="mname" x="${W-18}" y="${H-56}" text-anchor="middle">N</text>`;
 svg.innerHTML=o}
function list(){const{k,c}=CATS[S.tab],on=rowsNow(false),by={};on.forEach(r=>(by[r.id]??={id:r.id,m:r.m,v:r.v,g:r.g,it:[]}).it.push(r));
 let h='';['Namelok','Isinet','Kimana'].forEach(m=>{const s=Object.values(by).filter(x=>x.m===m).sort((a,b)=>a.id-b.id);if(!s.length)return;h+=`<h3>Sold in ${m}</h3>`;
  s.forEach(x=>{const dot=S.tab==='Dairy'?`<b style="background:${c[x.g]}"></b>`:'';
   const pr=x.it.map(r=>{const a=S.se==='w'?r.w:r.d,b=S.se==='w'?r.d:r.w;return`<span style="${S.tab==='Meat'?'color:'+c[r.p]:''}">${S.tab==='Meat'?r.p+' ':''}<b style="font-weight:700">${a}</b>${a!==b?` <small>(${S.se==='w'?'dry':'wet'} ${b})</small>`:''}</span>`}).join('');
   h+=`<li tabindex="0" data-id="${x.id}"><span class="id">${dot}${x.id}</span><span class="fr ${x.v===x.m?'loc':''}">${x.v===x.m?'local':'from '+x.v}</span><span class="pr">${pr}</span></li>`})});
 $('#list').innerHTML=h;
 const u=S.tab==='Dairy'?'litre':'kg';$('#note').textContent=`Prices in KES per ${u} (${S.se==='w'?'wet':'dry'} season shown; the other season in brackets when different). `+
  (S.tab==='Dairy'?'Cow milk only. ':'All meat sellers surveyed are male. ')+`Not mapped, no village coordinates: ID ${D.miss[S.tab].join(', ')}.`}
function chips(){const{c}=CATS[S.tab];$('#chips').innerHTML=Object.entries(c).map(([n,col])=>`<button class="chip" style="--c:${col}" data-n="${n}" aria-pressed="${!S.off[S.tab].has(n)}"><i></i>${n}</button>`).join('')}
function hi(ids){svg.querySelectorAll('.flow').forEach(f=>f.classList.toggle('dim',!!ids&&!ids.some(i=>f.dataset.ids.split(',').includes(String(i)))));
 document.querySelectorAll('#list li').forEach(l=>l.classList.toggle('on',!!ids&&ids.includes(+l.dataset.id)))}
function render(){chips();draw();list()}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.v;document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
$('#season').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.se=b.dataset.v;document.querySelectorAll('#season button').forEach(x=>x.setAttribute('aria-pressed',x===b));list()};
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const s=S.off[S.tab];s.has(b.dataset.n)?s.delete(b.dataset.n):s.add(b.dataset.n);render()};
svg.onmousemove=e=>{const f=e.target.closest('.flow');if(!f){tip.style.display='none';hi(null);return}
 const ids=f.dataset.ids.split(',').map(Number),cs=f.dataset.c.split(','),k=CATS[S.tab].k;
 const rs=rowsNow(false).filter(r=>ids.includes(r.id)&&cs.includes(r[k])&&(f.dataset.t.includes('→')?f.dataset.t.startsWith(r.v+' →')||(r.v==='Nakueni'&&f.dataset.t.startsWith('Nakueni')):r.v===r.m));
 tip.innerHTML=`<h4>${f.dataset.t}</h4>`+rs.map(r=>`<div><span>ID ${r.id} · ${S.tab==='Dairy'?r.g:r.p}</span><span>${r.w===r.d?r.w:r.w+' wet / '+r.d+' dry'}</span></div>`).join('');
 tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-270)+'px';tip.style.top=(e.clientY+14)+'px';hi(ids)};
svg.onmouseleave=()=>{tip.style.display='none';hi(null)};
const L=$('#list');L.onmouseover=e=>{const l=e.target.closest('li');if(l)hi([+l.dataset.id])};L.onmouseleave=()=>hi(null);
L.onfocusin=e=>{const l=e.target.closest('li');if(l)hi([+l.dataset.id])};L.onfocusout=()=>hi(null);
render();
</script></body></html>
